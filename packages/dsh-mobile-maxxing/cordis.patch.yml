# Registers this package. Everything it ships — PWA shell, phone UX,
# notifications, CJK rendering, "open with", session-id copy — is one plugin:
# the client module system maps one package to one browser module, so the
# behaviours cannot be separate packages without also being separate modules.
- insert:
    - id: dsh-mobile-maxxing
      name: "dsh-mobile-maxxing"
      config: {}
