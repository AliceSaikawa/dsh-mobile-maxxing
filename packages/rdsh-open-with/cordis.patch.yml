- insert:
    - id: rdsh-open-with
      name: "rdsh-open-with"
      config:
        # コマンドは引数なしの配列で起動される（シェルは介さない）。
        opener: "xdg-open"
        # インライン表示の上限（これを超えるファイルはダウンロード扱い）。
        maxInlineBytes: 10485760
        # workspaceRoot: "/path" # 相対パス解決の base。既定は現在の Session の cwd、
        # クライアントが cwd を送れないときだけ sandboxPolicy.workspaceRoot。
